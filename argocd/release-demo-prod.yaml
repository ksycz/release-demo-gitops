apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: release-demo-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ksycz/release-demo-gitops.git
    targetRevision: main
    path: chart
    helm:
      valueFiles:
        - ../env/prod/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: release-demo-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true