apiVersion: apps/v1
kind: Deployment
metadata:
  name: release-demo
  labels:
    app: release-demo
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: release-demo
  template:
    metadata:
      labels:
        app: release-demo
    spec:
      containers:
        - name: release-demo
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 8080

          readinessProbe:
            httpGet:
              path: /health
              port: 8080